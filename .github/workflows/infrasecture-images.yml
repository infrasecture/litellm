name: Infrasecture images

on:
  push:
    branches: [main, infrasecture_v1.105.0-rc.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrasecture-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/infrasecture/litellm
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  test:
    if: github.repository == 'infrasecture/litellm'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.11.18"
      - name: Install test dependencies
        run: uv sync --frozen --no-install-project --extra proxy --extra extra_proxy --group dev
      - name: Test adapters, cache affinity, search routing and passthrough regressions
        run: >-
          uv run --no-sync pytest -q --tb=short
          tests/unit/llms/chatgpt tests/unit/proxy/chatgpt_endpoints
          tests/unit/passthrough tests/unit/llms/pass_through

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the checked-out source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: litellm:smoke
          build-args: LITELLM_RELEASE_TAG=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/infrasecture/litellm
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.arch }}
      - name: Verify the packaged proxy without external network access
        run: >-
          docker run --rm --network none
          --mount type=bind,source="$PWD/.github/scripts/infrasecture_image_smoke.py",target=/tmp/smoke.py,readonly
          --entrypoint python litellm:smoke /tmp/smoke.py
      - name: Publish the tested architecture by digest
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: LITELLM_RELEASE_TAG=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/infrasecture/litellm
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.arch }}
      - name: Save image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish both architectures under the channel and commit tags
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          case "$REF_NAME" in
            main) channel=main ;;
            infrasecture_v1.105.0-rc.1) channel=v1.105.0-rc.1 ;;
            *) echo "Unsupported publication ref: $REF_NAME" >&2; exit 1 ;;
          esac
          digests=(*)
          test "${#digests[@]}" -eq 2
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$channel" --tag "$IMAGE:sha-$COMMIT" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:sha-$COMMIT"
          echo "Published $IMAGE:$channel and $IMAGE:sha-$COMMIT" >> "$GITHUB_STEP_SUMMARY"
